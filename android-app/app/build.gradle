plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
 namespace 'com.magicmate.printer'
 compileSdk 35
 defaultConfig { applicationId 'com.magicmate.printer'; minSdk 23; targetSdk 35; versionCode 1; versionName '1.0' }
}
dependencies {
 implementation 'androidx.core:core-ktx:1.15.0'
 implementation 'androidx.appcompat:appcompat:1.7.0'
 implementation 'com.github.bumptech.glide:glide:4.16.0'
 implementation('io.socket:socket.io-client:4.8.1') { exclude group: 'org.json', module: 'json' }
}
